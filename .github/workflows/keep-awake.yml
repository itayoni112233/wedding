# Keeps the free wedding database (Supabase) from going to sleep:
# free projects pause after a week with no activity.
name: keep wedding database awake

on:
  schedule:
    - cron: "23 7 */2 * *"   # every two days
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database (no data is read)
        run: |
          curl -sf --max-time 60 -X POST \
            "https://odaeycwcyuqfmjrfcvtd.supabase.co/rest/v1/rpc/wedding_ping" \
            -H "apikey: sb_publishable_htI8j-LrIQpAtBfEu6J5tg_DFonLe2V" \
            -H "Content-Type: application/json" -d '{}'

      - uses: actions/checkout@v4

      # GitHub stops scheduled jobs in repos with no commits for 60 days.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now - last)) -gt 3888000 ]; then
            date -u > .github/keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "keepalive"
            git push
          fi
